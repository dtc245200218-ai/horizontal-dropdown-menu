<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horizontal Dropdown Menu</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background-color: #f4f4f4;
        padding: 30px;
      }

      h1 {
        margin-bottom: 25px;
        color: #333;
      }

      #menu {
        height: 45px;
        background-color: #222;
        border: 1px solid #111;
      }

      #menu ul {
        list-style: none;
      }

      #menu > ul > li {
        float: left;
        position: relative;
      }

      #menu a {
        display: block;
        width: 140px;
        height: 43px;
        line-height: 43px;
        text-align: center;
        color: white;
        text-decoration: none;
        font-size: 16px;
      }

      #menu a:hover {
        background-color: red;
      }

      #menu ul ul {
        position: absolute;
        top: 43px;
        left: 0;
        background-color: #222;
        visibility: hidden;
        z-index: 100;
      }

      #menu ul li:hover > ul {
        visibility: visible;
      }

      .content {
        margin-top: 30px;
        line-height: 1.8;
        color: #444;
      }
    </style>
  </head>

  <body>
    <h1>Horizontal Dropdown Menu</h1>

    <nav id="menu">
      <ul>
        <li><a href="#home">Home</a></li>

        <li>
          <a href="#products">Products ▼</a>
          <ul>
            <li><a href="#laptop">Laptop</a></li>
            <li><a href="#phone">Phone</a></li>
            <li><a href="#tablet">Tablet</a></li>
          </ul>
        </li>

        <li>
          <a href="#services">Services ▼</a>
          <ul>
            <li><a href="#design">Web Design</a></li>
            <li><a href="#development">Development</a></li>
            <li><a href="#support">Support</a></li>
          </ul>
        </li>

        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>

    <div class="content">
      <h2>Welcome to our website!</h2>
      <p>Di chuột vào Products hoặc Services để xem menu con.</p>
    </div>
  </body>
</html>
